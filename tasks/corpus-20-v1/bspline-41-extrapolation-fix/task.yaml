id: bspline-41-extrapolation-fix
title: "bspline-fortran: fix extrapolation for 2D+ tensor product b-splines"
repo_url: https://github.com/jacobwilliams/bspline-fortran.git
issue_url: https://github.com/jacobwilliams/bspline-fortran/pull/41
source_pr_url: https://github.com/jacobwilliams/bspline-fortran/pull/41
base_commit: 51cd45503db517077652fdf830d37ca5b2f029e5
fixed_commit: a49663e66fd6fbf8973e132e209bbe2290b437aa
language: fortran
difficulty: medium
selection_lane: bspline-fortran
runner_class: macos-fast
oracle_strategy: compile-and-run
