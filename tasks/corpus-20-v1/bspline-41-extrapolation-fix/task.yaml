issue_body: |
  Extrapolation for 2D and higher-dimensional b-spline evaluation returns
  errors instead of valid results. The `dintrv` routine sets a `mflag` status
  variable that was being checked against the wrong name (`mflag` instead of
  `iflag`), and the upper-bound clamp in `get_temp_x_for_extrap` did not
  properly shift the evaluation point inside the knot span.

  Expected behavior:
  - `db2val(..., extrap=.true.)` should return an interpolated value when
    the evaluation point is outside the knot range
  - `iflag` should be 0 after a successful extrapolated evaluation
acceptance_hint: |
  The validator compiles a small Fortran program against the built bspline
  library. It sets up a 2D b-spline, evaluates at extrapolation points
  beyond the grid in both x and y, and checks that `iflag` is zero.

  The base commit is expected to fail with a nonzero `iflag` error.
  The fixed commit is expected to pass.
