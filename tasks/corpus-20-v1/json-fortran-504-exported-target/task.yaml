issue_body: |
  The installed CMake package should export a complete imported target for
  downstream consumers. Before the fix, users had to repair the target
  themselves to add include directories and namespacing.

  Expected behavior:
  - the library configures, builds, and installs successfully
  - the installed package exports a namespaced target
  - a tiny Fortran consumer can `find_package(...)`, link the imported target,
    and compile against `use json_module`
acceptance_hint: |
  The validator builds and installs the checked-out json-fortran tree into a
  temporary prefix, discovers the installed package name, and configures a tiny
  consumer project that links the exported static target and uses `json_module`.

  The base commit is expected to fail because the exported target is still
  incomplete. The fixed commit is expected to configure and build the consumer.
