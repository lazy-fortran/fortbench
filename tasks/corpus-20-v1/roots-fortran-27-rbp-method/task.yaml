issue_body: |
  Add the RBP (Regula Falsi-Bisection-Parabolic) root-finding method to the
  roots-fortran library. This is a combined bracketing algorithm described in:

  Alojz Suhadolnik, "Combined bracketing methods for solving nonlinear
  equations", Applied Mathematics Letters, Volume 25, Issue 11, 2012,
  Pages 1755-1760.

  The method combines regula falsi, bisection, and parabolic interpolation
  to achieve fast convergence while maintaining robustness.

  Expected behavior:
  - Add a `root_method_rbp` enum value (id=19) to the public method list
  - Add an `rbp_solver` type extending `root_solver` with a `find_root => rbp`
    procedure
  - Register it in the `set_of_root_methods` array
  - Add the `root_method_rbp` case in `root_scalar` allocation
  - Implement the `rbp` subroutine with parabolic interpolation fallback to
    bisection when the parabola step fails
  - Update tests to exercise the new method
acceptance_hint: |
  The validator builds roots-fortran with `fpm build`, then compiles a Fortran
  program that uses the RBP method to find the root of f(x) = x^3 - x - 2
  on [1, 2] (exact root near 1.5214). It verifies that:
  1. The `root_method_rbp` enum exists and has id 19
  2. The `rbp_solver` class exists and can be used via `root_scalar`
  3. The method converges to the correct root within tolerance
  4. The method is included in `set_of_root_methods`

  The base commit fails because the RBP method does not exist. The fixed
  commit provides the full implementation.
