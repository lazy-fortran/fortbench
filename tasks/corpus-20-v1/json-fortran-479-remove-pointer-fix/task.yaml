id: json-fortran-479-remove-pointer-fix
title: "json-fortran: nullify parent and previous pointers in json_value_remove"
repo_url: https://github.com/jacobwilliams/json-fortran.git
issue_url: https://github.com/jacobwilliams/json-fortran/pull/479
source_pr_url: https://github.com/jacobwilliams/json-fortran/pull/479
base_commit: 690a8bd2353fe8256448e6321d462b70e3e9daf8
fixed_commit: 8c12e7a425bcf5096dcd11812a090d2a0123e485
language: fortran
difficulty: small
selection_lane: json-fortran
