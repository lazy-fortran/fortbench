  - python3 {task_dir}/validate.py {workspace}
issue_body: |
  When removing an element from a JSON object using `json_value_remove`,
  the `parent`, `previous`, and `next` pointers of the removed node are not
  fully nullified. This causes corruption when the removed element is later
  re-inserted elsewhere in the tree, because stale pointers from the old
  location interfere with traversal.

  Expected behavior:
  - after `json%remove(p, .false.)`, `p%parent`, `p%previous`, and `p%next`
    should all be nullified
  - moving a node from one object to another via remove + add_by_path should
    preserve the remaining siblings in the source object
acceptance_hint: |
  The validator compiles a small Fortran program against the built json-fortran
  library. It creates a JSON with two objects, clones one key from object1 to
  object2, moves another key via remove + add_by_path, then verifies all keys
  are accessible in their expected locations.

  The base commit is expected to fail because stale pointers corrupt the tree.
  The fixed commit is expected to pass.
