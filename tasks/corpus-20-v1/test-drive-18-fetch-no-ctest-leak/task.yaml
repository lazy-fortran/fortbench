issue_body: |
  When `test-drive` is brought into another project via `FetchContent`,
  the upstream `test-drive` test suite should not appear in the consumer
  project's `ctest` list. The merged fix introduced a dedicated
  `TEST_DRIVE_BUILD_TESTING` option so the FetchContent path stops leaking
  `test-drive/all-tests`, `test-drive/check`, and `test-drive/select`
  into downstream projects.

  Expected behavior:
  - a consumer project using `FetchContent_MakeAvailable(test-drive)` can
    enable testing for itself without inheriting `test-drive`'s own tests
  - the consumer's `ctest -N` output should list only the consumer test
acceptance_hint: |
  The validator creates a tiny consumer CMake project that pulls in the
  checked-out `test-drive` source with `FetchContent`.

  The base commit is expected to leak upstream tests into `ctest -N`.
  The fixed commit is expected to list only the consumer's own `local-smoke`
  test.
