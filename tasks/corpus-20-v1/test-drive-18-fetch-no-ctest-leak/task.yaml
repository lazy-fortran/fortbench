id: test-drive-18-fetch-no-ctest-leak
title: "test-drive: FetchContent should not leak upstream tests into consumer CTest"
repo_url: https://github.com/fortran-lang/test-drive.git
issue_url: https://github.com/fortran-lang/test-drive/pull/18
source_pr_url: https://github.com/fortran-lang/test-drive/pull/18
base_commit: a1ab7854175b9d90f0cac7a504db404f2ed98160
fixed_commit: 68e22b87d9776d136c6ba69cc55fa43c59967bb6
language: fortran
difficulty: small
selection_lane: test-drive
runner_class: macos-fast
oracle_strategy: consumer-ctest
build_budget_seconds: 10
