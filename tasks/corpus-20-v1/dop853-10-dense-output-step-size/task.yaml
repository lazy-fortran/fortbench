issue_body: |
  The step size `h` was passed to the core integrator `dp86co` as a local
  copy instead of the class member `me%h`. During dense output callbacks,
  calling `me%info(h=hcur)` would return the initial step size rather than
  the current one, because the local variable `h` was updated internally
  but `me%h` was only set after the integration returned.

  Expected behavior:
  - During a dense output callback, `me%info(h=hcur)` should return a
    nonzero step size that reflects the current integration progress
acceptance_hint: |
  The validator compiles a Fortran program that integrates a simple ODE
  using dop853 with dense output enabled. Inside the `solout` callback,
  it queries the current step size via `me%info(h=hcur)` and checks that
  `hcur` is nonzero.

  The base commit returns a stale (zero or initial) `h` value in the
  callback. The fixed commit returns the actual current step size.
