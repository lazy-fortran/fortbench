name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Syntax check
        run: python -m py_compile fortbench/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate suite manifests
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path("suites").glob("*.yaml"):
              yaml.safe_load(path.read_text())
          for path in pathlib.Path("tasks").rglob("task.yaml"):
              data = yaml.safe_load(path.read_text())
              required = {"id", "title", "repo_url", "issue_url", "base_commit", "acceptance_commands"}
              missing = required.difference(data)
              if missing:
                  raise SystemExit(f"{path}: missing {sorted(missing)}")
          print("suite and task manifests validated")
          PY
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
